<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>あおのホームページ | 問い合わせ</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("site-theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (error) {}
    })();
  </script>
  <style>
    html { background: #fff7fb; }
    html[data-theme="dark"] { background: #11162a; }
  </style>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">あおのホームページ</h1>
      <div class="header-actions">
        <button class="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">メニュー</button>
        <nav id="primary-nav" class="site-nav" aria-label="メインナビゲーション">
          <ul class="nav-list">
            <li><a href="index.html">ホーム</a></li>
            <li><a href="about.html">自己紹介</a></li>
            <li><a href="projects.html">作品一覧</a></li>
            <li><a href="contact.html" aria-current="page">問い合わせ</a></li>
          </ul>
        </nav>
        <label class="theme-switch" for="theme-toggle">
          <input id="theme-toggle" class="theme-switch-input" type="checkbox" role="switch" aria-label="表示テーマを切り替える">
          <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span>
          <span class="theme-switch-label">ダークモード</span>
        </label>
      </div>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>お問い合わせ</h2>
      <p>このフォームから送信すると、連絡先メールに届く設定です。</p>
      <p><strong>連絡先:</strong> <a href="mailto:ao.apps.info@gmail.com">ao.apps.info@gmail.com</a></p>
    </section>

    <section class="card form-card">
      <form action="https://formsubmit.co/ao.apps.info@gmail.com" method="post">
        <input type="hidden" name="_subject" value="あおのホームページから新しい問い合わせ">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://ao03248.github.io/contact.html?sent=1">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" required>

        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" required>

        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="button">送信する</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2026 あお</small>
    </div>
  </footer>
</body>
</html>
