<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>あおのホームページ | ホーム</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("site-theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (error) {}
    })();
  </script>
  <style>
    html { background: #fff7fb; }
    html[data-theme="dark"] { background: #11162a; }
  </style>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">あおのホームページ</h1>
      <div class="header-actions">
        <button class="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">メニュー</button>
        <nav id="primary-nav" class="site-nav" aria-label="メインナビゲーション">
          <ul class="nav-list">
            <li><a href="index.html" aria-current="page">ホーム</a></li>
            <li><a href="about.html">自己紹介</a></li>
            <li><a href="projects.html">作品一覧</a></li>
            <li><a href="contact.html">問い合わせ</a></li>
          </ul>
        </nav>
        <label class="theme-switch" for="theme-toggle">
          <input id="theme-toggle" class="theme-switch-input" type="checkbox" role="switch" aria-label="表示テーマを切り替える">
          <span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span>
          <span class="theme-switch-label">ダークモード</span>
        </label>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>あお</h2>
      <p>
        開発者として、公式ホームページを作ってみました。<br>
        内容は今後追加していきます。
      </p>
      <a class="button" href="projects.html">作品一覧</a>
    </section>

    <section class="cards">
      <article class="card">
        <h3>技術領域</h3>
        <p>Webアプリ開発 / 自動化 / クラウド活用</p>
      </article>
      <article class="card">
        <h3>開発スタイル</h3>
        <p>バイブコーディングを主体として<br>開発を行います。<br>自分で修正を加えたり、<br>より細かく指示を出したりし、<br>効率的に作業を進めています。</p>
      </article>
      <article class="card">
        <h3>学習中</h3>
        <p>HTML, CSS, JavaScript, Python</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; 2026 あお</small>
    </div>
  </footer>
</body>
</html>
